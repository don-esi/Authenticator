<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; width: 300px; color: #202124; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { margin: 6px 0; }
    .ok { color: #15803d; }
    .bad { color: #b45309; }
    .muted { color: #5f6368; font-size: 12px; }
    button { margin-top: 8px; width: 100%; padding: 8px; cursor: pointer; }
    #candidates { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .cand {
      text-align: left;
      padding: 8px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .cand:hover { border-color: #1a73e8; background: #f8fbff; }
    .cand .title { font-weight: 600; display: block; }
    .cand .user { color: #5f6368; font-size: 12px; }
    code { font-size: 11px; }
  </style>
</head>
<body>
  <h1>Authenticator Vault</h1>
  <div class="row" id="status">Checking desktop vault…</div>
  <div class="row muted" id="detail"></div>
  <div id="candidates"></div>
  <button id="ping">Test connection</button>
  <script src="popup.js"></script>
</body>
</html>
